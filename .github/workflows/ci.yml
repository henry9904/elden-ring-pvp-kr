name: CI

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          config: .markdownlint.json
          globs: '**/*.md'

  links:
    name: Check Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          config-file: .mlc-config.json
          use-quiet-mode: 'yes'
          use-verbose-mode: 'yes'

  data:
    name: Verify Weapon Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check weapons.json is in sync with markdown sources
        run: python tools/extract_weapons.py --check

      - name: Check attack_ranges.json is in sync with CSV source
        run: python tools/extract_attack_ranges.py --check

      - name: Check animations.json is in sync with CSV source
        run: python tools/extract_animations.py --check

      - name: Check combos.json is in sync with markdown sources
        run: python tools/extract_combos.py --check

      - name: Verify DB ETL Pipeline executes successfully
        run: python tools/db_etl_pipeline.py

  build:
    name: Build Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build MkDocs site
        run: mkdocs build --strict
